<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2a2d32" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("job-board-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          var page = theme === "dark" ? "#0e1014" : "#2a2d32";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
          document.documentElement.style.backgroundColor = page;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", page);
        } catch (e) {}
      })();
    </script>
    <meta
      name="description"
      content="A calm, read-only board of job applications: submitted, waiting, interviewing, and closed."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Job search</title>
    <style>
      html,
      body {
        background: #2a2d32;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #0e1014;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
